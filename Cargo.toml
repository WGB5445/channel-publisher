[package]
name = "channel-publisher"
version = "0.1.0"
edition = "2024"
description = "A small self-hosted dashboard for publishing to Telegram and Slack channels"
license = "MIT"
repository = "https://github.com/WGB5445/channel-publisher"
readme = "README.md"
keywords = ["telegram", "slack", "publishing", "scheduler"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = "0.4"
chrono-tz = "0.10"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
url = "2"
